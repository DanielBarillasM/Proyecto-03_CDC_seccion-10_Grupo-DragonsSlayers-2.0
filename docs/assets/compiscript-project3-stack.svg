<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Registro de activación MIPS del compilador Compiscript</title>
  <desc id="desc">La pila contiene argumentos, dirección de retorno, frame anterior, entorno del closure, variables y temporales.</desc>
  <defs><filter id="s"><feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#111"/></marker></defs>
  <rect width="1200" height="500" fill="#fff9ec"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="55" y="62" font-size="34" font-weight="900">CONVENCIÓN DE LLAMADAS</text>
    <text x="55" y="96" font-size="18">Frames reales en pila · argumentos de 32 bits · retorno en $v0/$f0</text>
    <g transform="translate(100 125)" filter="url(#s)">
      <rect width="520" height="320" fill="#fff" stroke="#111" stroke-width="7"/>
      <g stroke="#111" stroke-width="3"><path d="M0 52h520M0 104h520M0 156h520M0 208h520M0 260h520"/></g>
      <g font-size="20" font-weight="700"><text x="24" y="34">argumentos del llamador</text><text x="24" y="86">$ra guardado</text><text x="24" y="138">$fp anterior</text><text x="24" y="190">$s7 / entorno closure</text><text x="24" y="242">variables y parámetros</text><text x="24" y="294">temporales TAC</text></g>
      <g font-family="monospace" font-size="16" text-anchor="end"><text x="495" y="34">offset alto</text><text x="495" y="294">$fp = $sp</text></g>
    </g>
    <g transform="translate(720 130)">
      <rect width="390" height="82" fill="#ffd426" stroke="#111" stroke-width="6" filter="url(#s)"/><text x="195" y="35" text-anchor="middle" font-size="22" font-weight="900">PRÓLOGO</text><text x="195" y="63" text-anchor="middle" font-family="monospace" font-size="16">reserva · guarda · copia params</text>
      <rect y="128" width="390" height="82" fill="#ffe98a" stroke="#111" stroke-width="6" filter="url(#s)"/><text x="195" y="163" text-anchor="middle" font-size="22" font-weight="900">CUERPO TAC → MIPS</text><text x="195" y="191" text-anchor="middle" font-family="monospace" font-size="16">getReg · loads · stores · jal</text>
      <rect y="256" width="390" height="82" fill="#32d583" stroke="#111" stroke-width="6" filter="url(#s)"/><text x="195" y="291" text-anchor="middle" font-size="22" font-weight="900">EPÍLOGO</text><text x="195" y="319" text-anchor="middle" font-family="monospace" font-size="16">restaura · libera · jr $ra</text>
      <path d="M195 84v36M195 212v36" stroke="#111" stroke-width="6" marker-end="url(#a)"/>
    </g>
  </g>
</svg>
