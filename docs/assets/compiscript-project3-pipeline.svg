<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline del compilador Compiscript del Proyecto 3</title>
  <desc id="desc">Código fuente pasa por lexer, parser, semántica, TAC y backend MIPS para producir un archivo ejecutable en MARS.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="9" dy="9" stdDeviation="0" flood-color="#111"/></filter>
    <linearGradient id="yellow" x1="0" x2="1"><stop stop-color="#ffe98a"/><stop offset="1" stop-color="#ffd426"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#111"/></marker>
  </defs>
  <rect width="1500" height="430" fill="#fff9ec"/>
  <g fill="none" stroke="#111" stroke-width="8" marker-end="url(#arrow)">
    <path d="M245 220h55"/><path d="M490 220h55"/><path d="M735 220h55"/><path d="M980 220h55"/><path d="M1225 220h55"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(35 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="28" font-weight="900">CÓDIGO</text><g font-family="monospace" text-anchor="start" font-size="17" fill="#111"><text x="22" y="105">let x = 6;</text><text x="22" y="138">let y = 7;</text><text x="22" y="185">function mul(a,b)</text><text x="22" y="218">  return a * b;</text><text x="22" y="265">print(mul(x,y));</text></g></g>
    <g transform="translate(280 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="28" font-weight="900">LEXER</text><g font-size="16" font-weight="700"><rect x="20" y="90" width="73" height="34" fill="#ffe98a" stroke="#111" stroke-width="3"/><text x="56" y="113">LET</text><rect x="110" y="90" width="80" height="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="150" y="113">ID(x)</text><rect x="20" y="142" width="73" height="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="56" y="165">=</text><rect x="110" y="142" width="80" height="34" fill="#ffe98a" stroke="#111" stroke-width="3"/><text x="150" y="165">INT(6)</text><rect x="20" y="194" width="170" height="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="217">FUNCTION</text><rect x="20" y="246" width="170" height="34" fill="#ffe98a" stroke="#111" stroke-width="3"/><text x="105" y="269">ID(mul)</text></g></g>
    <g transform="translate(525 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="28" font-weight="900">PARSER</text><g fill="#ffe98a" stroke="#111" stroke-width="3"><rect x="67" y="86" width="76" height="30"/><rect x="15" y="153" width="75" height="30"/><rect x="120" y="153" width="75" height="30"/><rect x="67" y="220" width="76" height="30"/></g><g stroke="#111" stroke-width="3"><path d="M105 116 52 153M105 116l52 37M52 183l53 37M157 183l-52 37"/></g><g font-size="13" font-weight="700"><text x="105" y="106">Program</text><text x="52" y="173">VarDecl</text><text x="157" y="173">FuncDecl</text><text x="105" y="240">Call</text></g></g>
    <g transform="translate(770 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="25" font-weight="900">SEMÁNTICA</text><g fill="#ffe98a" stroke="#111" stroke-width="3"><circle cx="105" cy="112" r="28"/><circle cx="48" cy="190" r="26"/><circle cx="162" cy="190" r="26"/></g><g stroke="#111" stroke-width="3"><path d="M88 134 62 168M122 134l26 34"/></g><g font-size="12" font-weight="700"><text x="105" y="116">global</text><text x="48" y="194">x:int</text><text x="162" y="194">mul:fn</text></g><rect x="25" y="238" width="160" height="38" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="263" font-size="15" font-weight="700">0 errores</text></g>
    <g transform="translate(1015 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="28" font-weight="900">TAC</text><g font-family="monospace" text-anchor="start" font-size="15"><text x="17" y="105">param 6</text><text x="17" y="136">param 7</text><text x="17" y="167">t0 = call mul, 2</text><text x="17" y="198">print t0</text></g><rect x="18" y="230" width="174" height="48" fill="#ffe98a" stroke="#111" stroke-width="3"/><text x="105" y="251" font-size="13" font-weight="700">frames · offsets</text><text x="105" y="268" font-size="13" font-weight="700">temporales · CFG</text></g>
    <g transform="translate(1260 75)"><rect width="210" height="290" fill="#fff" stroke="#111" stroke-width="7"/><rect width="210" height="64" fill="url(#yellow)" stroke="#111" stroke-width="7"/><text x="105" y="43" font-size="25" font-weight="900">MIPS / MARS</text><g font-family="monospace" text-anchor="start" font-size="14"><text x="15" y="102">addiu $sp,$sp,-N</text><text x="15" y="132">sw $ra,N($sp)</text><text x="15" y="162">jal fn_mul</text><text x="15" y="192">move $a0,$v0</text><text x="15" y="222">syscall</text></g><rect x="18" y="244" width="174" height="38" fill="#32d583" stroke="#111" stroke-width="3"/><text x="105" y="269" font-size="15" font-weight="900">SALIDA: 42</text></g>
  </g>
</svg>
